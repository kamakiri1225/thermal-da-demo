# 構造解析用の代表的な鋼材物性値。
# 101_0の熱物性と同じ「一般構造用鋼材相当」という前提であり、
# 実材料が決まったら材料メーカーの値へ更新する。
young_modulus_Pa: 2.05e+11
poisson_ratio: 0.3
density_kg_m3: 7850.0
thermal_expansion_coeff_per_K: 1.2e-5
reference_temperature_K: 293.15

sources:
  - 各種材料便覧の構造用鋼材代表値（ヤング率200～210 GPa、ポアソン比0.3、線膨張係数11～13e-6/K程度）

# 101_0の初期温度（293.15 K = 20 degC）と一致させる。
# 異なる値にすると、熱ひずみをゼロとみなす温度がずれる。
note: reference_temperature_K は101_0の初期温度と一致させること。
