<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<title>オープンCAE2026 はじめに</title>
<style>
 body{margin:0;font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif;background:#eee;padding:24px}
 .slide{width:1280px;height:720px;background:#fff;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.25);
        position:relative;box-sizing:border-box}
 .bar{background:#1F4E9C;color:#fff;padding:14px 26px;font-size:40px;font-weight:700;
      display:flex;justify-content:space-between;align-items:center}
 .bar span{font-size:18px;font-weight:400}
 .rule{height:5px;background:#2E75D4}
 .body{padding:18px 34px}
 ul{margin:0 0 10px 0;padding-left:26px;font-size:20px;line-height:1.75}
 li{margin-bottom:4px}
 .em{color:#C00000;font-weight:700;text-decoration:underline}
 .lead{font-size:19px;margin:6px 0 14px 4px}
 .figs{display:flex;gap:26px;justify-content:center;align-items:flex-start}
 .figs figure{margin:0;text-align:center}
 .figs img{height:268px;border:1px solid #bbb}
 .figs figcaption{font-size:15px;color:#333;margin-top:4px}
 .concl{position:absolute;bottom:26px;left:0;width:100%;text-align:center;
        font-size:22px;font-weight:700}
 .concl u{text-decoration-color:#C00000;text-decoration-thickness:3px}
</style></head><body>
<div class="slide">
  <div class="bar"><div>はじめに</div><span>2</span></div><div class="rule"></div>
  <div class="body">
    <ul>
      <li>工作機械の加工誤差のうち、<b>熱変位が占める割合は40〜70 %</b> であり、最大の誤差要因である。</li>
      <li>対策は「熱的に素性の良い設計」「温度制御」「モデルによる補償」の3系統であり、
          実用の主役は<b>補償</b>＝熱変形を正しく予測することである。</li>
      <li><span class="em">TCP変位は温度の絶対値ではなく温度勾配で決まる</span>ため、
          <span class="em">温度の傾向が合っても変形の傾向が合うとは限らない</span>。</li>
    </ul>
    <div class="lead">さらに熱伝達率などの境界条件は直接測れず、その不確かさが変形予測の精度を直接左右する。</div>
    <div class="figs">
      <figure>
        <img src="../docs/img/intro_temp_history.png" alt="温度の時間変化">
        <figcaption>温度の時間変化（測温点）</figcaption>
      </figure>
      <figure>
        <img src="../docs/img/intro_deform_anim.gif" alt="熱変形と変位">
        <figcaption>熱変形の様子と変位の時間変化（誇張表示）</figcaption>
      </figure>
    </div>
  </div>
  <div class="concl">限られた実測から<u>境界条件ごと補正し、熱変形そのものを推定する枠組み</u>が求められる</div>
</div>
</body></html>
