# 104: OpenFOAM×FrontISTR データ同化(温度＋変位観測)の設定
# 103 と同じ最小実行規模(既存102_0メッシュ・直列・輻射あり)。
# 観測に FrontISTR 熱膨張の上面変位2点を追加している。

experiment:
  t_end_s: 20.0
  obs_interval_s: 10.0   # -> 2 サイクル
  seed: 20260908

truth:
  T0_K: 293.15
  Q_true_W: 15.0

observation:
  # 温度観測(固体表面近傍、最近傍セル)
  temp_probes:
    hot:  [0.032, 0.0, 0.05025]
    cold: [-0.032, 0.0, 0.05025]
  temp_noise_C: 0.30
  # 変位観測(FrontISTR 上面 Uz、実験の変位センサに対応)
  disp_names: [uz_heater_mm, uz_opposite_mm]
  disp_noise_mm: 1.0e-4   # 0.1 um (レーザ変位計クラス)

ensemble:
  n_members: 5
  init_T_min_K: 280.0
  init_T_max_K: 320.0
  init_Q_min_W: 5.0
  init_Q_max_W: 30.0

filter:
  inflation: 1.05
  T_clip_K: [250.0, 400.0]
  Q_bounds_W: [0.0, 60.0]
