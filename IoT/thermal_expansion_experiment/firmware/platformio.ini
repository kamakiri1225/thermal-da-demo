; PlatformIO project config for the SUS304 rod thermal-expansion logger.
; Board: ESP32-DevKitC-32E (ESP32-WROOM-32E). See docs/06_esp32_setup.md.
;
; Arduino IDEでビルドする場合は docs/06_esp32_setup.md 6.2節の手順で
; src/*.cpp,*.h をスケッチフォルダへコピーし、main.cpp を
; <スケッチフォルダ名>.ino にリネームして使う。

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
lib_deps =
    adafruit/Adafruit MAX31856 library@^1.3.2
    adafruit/Adafruit BusIO@^1.14.1
; Digimatic/SPC受信は外部ライブラリを使わず firmware/src/digimatic_reader.cpp で
; GPIO割込みにより自前実装している（docs/05_digimatic_protocol.md 参照、要実機確認）。
